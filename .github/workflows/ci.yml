name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin 2>&1 | tee /tmp/build.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest 2>&1 | tee -a /tmp/build.log

      # Сверка вёрстки с эталонными скриншотами. Эталоны записаны на ubuntu
      # (workflow «Record screenshots»), поэтому сравнение здесь идёт на той же платформе.
      - name: Screenshot tests
        run: |
          set -o pipefail
          ./gradlew :app:verifyRoborazziDebug 2>&1 | tee -a /tmp/build.log

      # Полный лог Gradle снаружи не прочитать, поэтому ошибки печатаются отдельным шагом.
      - name: Что именно упало
        if: failure()
        run: |
          grep -E "^e: |FAILED|AssertionError|Expected|expected:" /tmp/build.log \
            | head -60 || echo "строк с ошибками не нашлось"

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diff
          path: |
            app/build/outputs/roborazzi/
            app/src/test/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
