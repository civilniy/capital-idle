name: Record screenshots

# Перезапись эталонных скриншотов. Запускается вручную: Actions → Record screenshots → Run workflow,
# выбрав нужную ветку. Эталоны пишутся на ubuntu и коммитятся в эту же ветку, поэтому
# сверка в CI всегда сравнивает картинки, снятые на той же платформе.
#
# Когда запускать: после осознанного изменения дизайна, когда шаг «Screenshot tests» в CI
# упал не из-за дефекта, а потому что вёрстка изменилась намеренно.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Record screenshots
        run: |
          set -o pipefail
          ./gradlew :app:recordRoborazziDebug 2>&1 | tee /tmp/build.log

      # Полный лог Gradle со стектрейсом читать неоткуда: артефакты и логи прогонов
      # снаружи недоступны. Этот шаг печатает только то, ради чего лог и открывают —
      # ошибки компиляции и упавшие проверки.
      - name: Что именно упало
        if: failure()
        run: |
          grep -E "^e: |^w: .*error|FAILED|AssertionError|Expected|expected:" /tmp/build.log \
            | head -60 || echo "строк с ошибками не нашлось"

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          if git diff --staged --quiet; then
            echo "Эталоны не изменились — коммитить нечего."
          else
            git commit -m "chore: перезаписать эталонные скриншоты вёрстки [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorded-screenshots
          path: app/src/test/screenshots/
          if-no-files-found: warn
          retention-days: 7
